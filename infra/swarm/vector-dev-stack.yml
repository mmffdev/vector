version: "3.9"

# vector-dev — Docker Swarm stack for the dev Postgres tier and supporting UIs.
# Lives on host vector-dev-pg (77.68.33.216). Deploy / re-deploy with:
#
#   docker stack deploy -c vector-dev-stack.yml vector-dev
#
# Captured from the live service spec on 2026-05-18. See README.md for the
# discovery procedure (in case anyone needs to re-sync this file with a future
# out-of-band `docker service update`).

services:

  # --- Postgres (pgvector) -------------------------------------------------
  # Image is pinned by digest to match what's running today. Bump deliberately
  # — never use a floating tag here; pgdata format and migration drift depend
  # on a known-good binary.
  #
  # Args enable pg_stat_statements (installed 2026-05-18). If you change these,
  # update docs/c_sql_cookbook.md (performance / pg_stat_statements section).
  postgres:
    image: pgvector/pgvector@sha256:a132765ec351c65111b5b675928a3a0515a466a40f97277329db8b8209ad8bc9
    command:
      - "-c"
      - "shared_preload_libraries=pg_stat_statements"
      - "-c"
      - "pg_stat_statements.max=10000"
      - "-c"
      - "pg_stat_statements.track=all"
    environment:
      # Pillar 3 step 3 (refactorDB, 2026-05-26): mmff_vector was DROPped at
      # the end of the three-pillar refactor. POSTGRES_DB only matters for
      # FRESH-volume rebuilds (the live pgdata volume already has all DBs
      # created — mmff_vector lingered as a write-mute zombie until step 3
      # and was then dropped). For any fresh volume, vector_artefacts is
      # now the canonical tenant DB.
      POSTGRES_DB: vector_artefacts
      POSTGRES_USER: mmff_dev
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - source: postgres_password
        target: postgres_password
        uid: "0"
        gid: "0"
        mode: 0444
    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1

  # --- Adminer (DB UI) ----------------------------------------------------
  # Reached over the SSH tunnel — bound to port 8085 on the host. The
  # `adminer:latest` tag matches the live spec; pin to a digest if procurement
  # ever asks (no functional reason today).
  adminer:
    image: adminer:latest
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - target: 8080
        published: 8085
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1

  # --- Homepage (internal landing page) -----------------------------------
  # Config lives on the host bind-mount at /opt/vector-dev/homepage-config —
  # NOT in this repo. Treat the bind path as ops-owned; document changes
  # in this stack file's git history.
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost:7575,127.0.0.1:7575"
    volumes:
      - type: bind
        source: /opt/vector-dev/homepage-config
        target: /app/config
    ports:
      - target: 3000
        published: 7575
        protocol: tcp
        mode: ingress
    deploy:
      replicas: 1

  # --- Valkey (Redis-protocol-compatible cache) ----------------------------
  # BSD-3 Linux Foundation fork of Redis 7.2 — chosen over Redis after the
  # March 2024 SGPL/RSAL licence change. Used by Notifications v2 PendingStore
  # (S12) for debounce/digest ZSETs. Room to reuse for rate-limit +
  # session-cache later per PLA067 §Approach. Netdata is retired from the dev
  # stack; Valkey owns 6379 and stays password-protected because the port is
  # published through Swarm.
  valkey:
    image: valkey/valkey:8-alpine
    command:
      - sh
      - -c
      - exec valkey-server --dir /data --appendonly yes --appendfsync everysec --save 60 1 --requirepass "$$(cat /run/secrets/valkey_password)"
    volumes:
      - valkeydata:/data
    secrets:
      - source: valkey_password
        target: valkey_password
        uid: "0"
        gid: "0"
        mode: 0444
    ports:
      - target: 6379
        published: 6379
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$(cat /run/secrets/valkey_password)\" ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      replicas: 1

  # --- Valkey UI (Redis Commander) -----------------------------------------
  # Browser-only dev UI for inspecting Valkey keys. It is read-only and
  # HTTP-auth protected; auth uses the same Docker secret as Valkey so no UI
  # password lives in this repo.
  valkey_ui:
    image: rediscommander/redis-commander:latest
    entrypoint:
      - sh
      - -c
      - >
        exec /redis-commander/docker/entrypoint.sh
        --http-auth-username vector
        --http-auth-password "$$(cat /run/secrets/valkey_password)"
        --redis-host valkey
        --redis-port 6379
        --redis-password "$$(cat /run/secrets/valkey_password)"
        --redis-label "Vector Valkey"
        --read-only
        --nosave
        --no-log-data
        --use-scan
    secrets:
      - source: valkey_password
        target: valkey_password
        uid: "0"
        gid: "0"
        mode: 0444
    ports:
      - target: 8081
        published: 3003
        protocol: tcp
        mode: ingress
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8081/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      replicas: 1

# --- Volumes ---------------------------------------------------------------
# pgdata is the persistent Postgres data dir. NEVER delete this volume.
# valkeydata is Valkey's append-only/persistence volume. Take a backup via
# <backupsql> before any Postgres volume-touching op.
volumes:
  pgdata:
  valkeydata:

# --- Secrets ---------------------------------------------------------------
# Secrets are managed out-of-band and marked `external: true`.
# To rotate postgres_password:
#   echo -n "<newpassword>" | docker secret create postgres_password_v2 -
#   <update this file to reference postgres_password_v2>
#   docker stack deploy -c vector-dev-stack.yml vector-dev
#   docker secret rm postgres_password
# Then rotate the password in backend/.env.dev and restart the backend.
secrets:
  postgres_password:
    external: true
  valkey_password:
    external: true
