services:
  loki:
    image: grafana/loki@sha256:b025a0220f390baaab01578aea2fe0ba677584d9f248c3fe5af15f84dd1de60d
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yml
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yml
    networks:
      - loki-net
    restart: unless-stopped

  alloy:
    image: grafana/alloy@sha256:51aeb9d829239345070619dad3edd6873186f913c84f45b365b74574fcb38ec0
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    networks:
      - loki-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana@sha256:f9811e4e687ffecf1a43adb9b64096c50bc0d7a782f8608530f478b6542de7d5
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_LOG_LEVEL=info
    volumes:
      - grafana-storage:/var/lib/grafana
      - /opt/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - loki-net
    restart: unless-stopped

  prometheus:
    image: prom/prometheus@sha256:49214755b6153f90a597adcbff0252cc61069f8ab69ce8411285cd4a560e8038
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts:/etc/prometheus/rules:ro
      - prometheus-storage:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    depends_on:
      - alertmanager
      - node-exporter
      - cadvisor
      - postgres-exporter
      - valkey-exporter
      - rabbitmq-exporter
      - blackbox-exporter
      - alloy
    networks:
      - loki-net
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager@sha256:51a825c2a40acc3e338fdd00d622e01ec090f72be2b3ea46be0839cd47a4d286
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-storage:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    networks:
      - loki-net
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter@sha256:e96064f876226d94bb6ce48a4c4b3dd76edba91168ec1ab024e5c4b959310b0f
    environment:
      DATA_SOURCE_NAME: postgresql://mmff_dev:${POSTGRES_EXPORTER_PASSWORD:?set POSTGRES_EXPORTER_PASSWORD}@host.docker.internal:5432/postgres?sslmode=disable
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "true"
      PG_EXPORTER_DISABLE_DEFAULT_METRICS: "false"
      PG_EXPORTER_DISABLE_SETTINGS_METRICS: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - loki-net
    restart: unless-stopped

  valkey-exporter:
    image: oliver006/redis_exporter@sha256:7ef8e9c26638158fa4e7ad60df8c7e53d1919986753d6c1d2d1876b6ec38d87b
    environment:
      REDIS_ADDR: redis://host.docker.internal:6379
      REDIS_PASSWORD: ${VALKEY_EXPORTER_PASSWORD:?set VALKEY_EXPORTER_PASSWORD}
      REDIS_EXPORTER_IS_CLUSTER: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - loki-net
    restart: unless-stopped

  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter@sha256:12f27d6d84e6dbdd72c6bc2605e48af9910517394483c1dfa3230e49d3e32107
    environment:
      RABBIT_URL: http://host.docker.internal:15672
      RABBIT_USER: mmff_dev
      RABBIT_PASSWORD: ${RABBITMQ_EXPORTER_PASSWORD:?set RABBITMQ_EXPORTER_PASSWORD}
      PUBLISH_PORT: "9419"
      OUTPUT_FORMAT: TTY
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - loki-net
    restart: unless-stopped

  blackbox-exporter:
    image: prom/blackbox-exporter@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    volumes:
      - ./blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - loki-net
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter@sha256:d00a542e409ee618a4edc67da14dd48c5da66726bbd5537ab2af9c1dfc442c8a
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
      - --web.listen-address=0.0.0.0:9100
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    networks:
      - loki-net
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3de2bd5203120b866d74a9b283b2ffb8ec382fbf9dc321814700c6ea6f44ec57
    privileged: true
    environment:
      - CADVISOR_HEALTHCHECK_URL=http://127.0.0.1:8080/healthz
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - --listen_ip=0.0.0.0
      - --port=8080
      - --housekeeping_interval=10s
      - --docker_only=true
      - --store_container_labels=false
    networks:
      - loki-net
    restart: unless-stopped

volumes:
  loki-storage:
  alloy-data:
  grafana-storage:
  prometheus-storage:
  alertmanager-storage:

networks:
  loki-net:
