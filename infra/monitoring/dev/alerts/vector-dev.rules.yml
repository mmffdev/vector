groups:
  - name: vector-dev-platform
    interval: 30s
    rules:
      - alert: VectorDevCollectorDown
        expr: up{job=~"node-exporter|cadvisor|postgres-exporter|valkey-exporter|rabbitmq|blackbox-http|blackbox-tcp|alloy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down on {{ $labels.host }}"
          description: "Prometheus cannot scrape {{ $labels.job }} target {{ $labels.instance }}."

      - alert: VectorDevEndpointDown
        expr: probe_success{job=~"blackbox-http|blackbox-tcp"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Endpoint probe failed: {{ $labels.instance }}"
          description: "Blackbox probe {{ $labels.job }} cannot reach {{ $labels.instance }}."

      - alert: VectorDevHighCpu
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m]))) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU on {{ $labels.host }}"
          description: "CPU usage has been above 85% for 10 minutes."

      - alert: VectorDevHighMemory
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory use on {{ $labels.host }}"
          description: "Memory usage has been above 85% for 10 minutes."

      - alert: VectorDevDiskNearlyFull
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|overlay|squashfs"})) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk nearly full on {{ $labels.host }}"
          description: "{{ $labels.mountpoint }} is above 80% used."

      - alert: VectorDevPostgresConnectionPressure
        expr: sum(pg_stat_activity_count{job="postgres-exporter"}) / max(pg_settings_max_connections{job="postgres-exporter"}) > 0.80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Postgres connection pressure"
          description: "Postgres is using more than 80% of max_connections."

      - alert: VectorDevRabbitQueueBacklog
        expr: sum(rabbitmq_queue_messages_ready{job="rabbitmq"}) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queue backlog"
          description: "RabbitMQ has more than 100 ready messages across queues."

      - alert: VectorDevValkeyEvictions
        expr: increase(redis_evicted_keys_total{job="valkey-exporter"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Valkey is evicting keys"
          description: "Valkey evicted keys in the last 5 minutes."

