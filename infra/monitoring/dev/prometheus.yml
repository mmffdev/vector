global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          host: vector-dev
          env: dev

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          host: vector-dev
          env: dev

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
        labels:
          host: vector-dev
          env: dev

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          host: vector-dev
          env: dev

  - job_name: alloy
    static_configs:
      - targets:
          - alloy:12345
        labels:
          host: vector-dev
          env: dev

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
        labels:
          host: vector-dev
          env: dev

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: vector-dev
          env: dev

  - job_name: postgres-exporter
    static_configs:
      - targets:
          - postgres-exporter:9187
        labels:
          host: vector-dev
          env: dev
          service: postgres

  - job_name: valkey-exporter
    static_configs:
      - targets:
          - valkey-exporter:9121
        labels:
          host: vector-dev
          env: dev
          service: valkey

  - job_name: rabbitmq
    static_configs:
      - targets:
          - rabbitmq-exporter:9419
        labels:
          host: vector-dev
          env: dev
          service: rabbitmq

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - http://host.docker.internal:7575/
          - http://host.docker.internal:8085/
          - http://host.docker.internal:15672/
          - http://host.docker.internal:3003/
          - http://grafana:3000/api/health
          - http://loki:3100/ready
        labels:
          host: vector-dev
          env: dev
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-tcp
    metrics_path: /probe
    params:
      module:
        - tcp_connect
    static_configs:
      - targets:
          - host.docker.internal:5432
          - host.docker.internal:5672
          - host.docker.internal:6379
        labels:
          host: vector-dev
          env: dev
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          host: vector-dev
          env: dev
