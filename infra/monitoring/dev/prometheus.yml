global:
  scrape_interval: 10s
  scrape_timeout: 8s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090
        labels:
          host: vector-dev
          env: dev

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          host: vector-dev
          env: dev

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080
        labels:
          host: vector-dev
          env: dev
