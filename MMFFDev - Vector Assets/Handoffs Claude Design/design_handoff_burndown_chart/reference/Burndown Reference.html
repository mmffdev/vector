<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Burndown — Filled trend + cone + scope re-baseline</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { padding: 40px; }
    .ref-wrap { max-width: 640px; margin: 0 auto; }
    .ref-note { color: var(--ink-muted); font-size: 13px; margin: 0 0 24px; }
  </style>
</head>
<body>
  <div class="ref-wrap">
    <section class="vk-card">
      <div class="vk-card-head">
        <div class="vk-eyebrow">Burndown · reference</div>
        <h3 class="vk-card-title">Filled trend, re-baselined, with forecast cone</h3>
        <p class="vk-card-desc">Burndown 02 (gradient-filled actual) merged with the forecast cone from 04 and the scope re-baseline treatment from 06 — the +12 pin, the shaded post-scope region, and the faint original 80→0 guideline.</p>
      </div>
      <div class="vk-kpi-wrap"></div>
      <div class="vk-chart" id="chart"></div>
      <div class="vk-legend"></div>
    </section>
  </div>

  <script src="data.js"></script>
  <script src="chartkit.js"></script>
  <script>
    // The exact merged config this handoff documents.
    const CONFIG = {
      type: 'burndown',
      area: true, areaGradient: true, smooth: true, // from 02 Filled trend
      cone: true,                                    // from 04 Forecast cone
      scopeMarker: true,                             // from 06 Scope re-baseline
      markers: true,
    };
    const STATE = {
      scopeOn: true,
      filters: { ideal: true, actual: true, optimistic: true, pessimistic: true, scope: false },
    };

    const C = window.SprintData.C;
    function colorFor(key) {
      return { ideal: C.ink, actual: C.red, optimistic: C.green, pessimistic: C.amber, scope: C.blue }[key];
    }
    const SERIES = [
      ['actual', 'Actual remaining'], ['ideal', 'Ideal (re-based)'],
      ['optimistic', 'Optimistic'], ['pessimistic', 'Pessimistic'],
    ];

    function kpis() {
      const D = window.SprintData.build(STATE.scopeOn);
      const k = D.kpis;
      const tiles = [['Committed', k.committed], ['Remaining', k.remaining], ['Velocity', k.velocity.toFixed(1) + '/d'], ['Days left', k.daysLeft]];
      const pill = k.onTrack ? '<span class="vk-pill vk-pill-ok">On track</span>'
        : `<span class="vk-pill vk-pill-warn">~${k.projectedShort} pts short</span>`;
      return `<div class="vk-kpis">${tiles.map(([l, v]) => `<div class="vk-kpi"><div class="vk-kpi-l">${l}</div><div class="vk-kpi-v t-num">${v}</div></div>`).join('')}<div class="vk-kpi vk-kpi-pill">${pill}</div></div>`;
    }

    window.ChartKit.create(document.getElementById('chart'), CONFIG, STATE);
    document.querySelector('.vk-kpi-wrap').innerHTML = kpis();
    document.querySelector('.vk-legend').innerHTML = SERIES
      .filter(([k]) => STATE.filters[k])
      .map(([k, l]) => `<span class="vk-leg"><span class="vk-dot" style="background:${colorFor(k)}"></span>${l}</span>`).join('');
  </script>
</body>
</html>
